name: jra-probe
# Temporary: fetches a few pages so the parsers can be written against real HTML.
on:
  push:
    branches: ["claude/jra-race-prediction-model-ps1z1w"]
    paths: [".github/workflows/jra-probe.yml", "jra_keiba/keiba/probe.py"]
permissions:
  contents: write
concurrency:
  group: jra-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch sample pages
        working-directory: jra_keiba
        run: python -m keiba.probe samples | tee samples_log.txt
      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jra_keiba/samples jra_keiba/samples_log.txt
          git commit -m "Add probe samples of source pages" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
