name: jra-predict
# Fetches the cards and current odds of upcoming graded races, runs the model and
# commits the betting report to jra_keiba/reports/.
on:
  push:
    branches: ["claude/jra-race-prediction-model-ps1z1w"]
    paths: ["jra_keiba/predict_trigger.json"]
  schedule:
    - cron: "23 11 * * 5"     # Fri 20:23 JST  (draw is out)
    - cron: "23 0 * * 6,0"    # Sat/Sun 09:23 JST
    - cron: "23 5 * * 6,0"    # Sat/Sun 14:23 JST (close to post time of the main race)
  workflow_dispatch:
    inputs:
      grades:
        description: "G1,G2,G3 or all"
        default: "G1,G2,G3"
      bankroll:
        description: "bankroll in yen used for stake sizing"
        default: "100000"
permissions:
  contents: write
concurrency:
  group: jra-predict
  cancel-in-progress: false
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jra_keiba/requirements.txt
      - run: pip install -q -r jra_keiba/requirements.txt
      - name: Restore trained model
        id: model
        uses: actions/cache@v4
        with:
          path: jra_keiba/data/work/model.pkl
          key: jra-model-${{ hashFiles('jra_keiba/data/raw/**/*.gz', 'jra_keiba/keiba/*.py') }}
          # Close to post time there is no room to retrain (about 15 minutes), so fall back to
          # the most recent trained model; a retrain is forced on Fridays or on request.
          restore-keys: |
            jra-model-
      - name: Fetch cards and odds
        id: fetch
        working-directory: jra_keiba
        env:
          GRADES: ${{ inputs.grades || 'G1,G2,G3' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            GRADES=$(jq -r '.grades // "G1,G2,G3"' predict_trigger.json)
            DATES=$(jq -r '.dates // ""' predict_trigger.json)
            RESULTS=$(jq -r '.results // ""' predict_trigger.json)
            echo "retrain=$(jq -r '.retrain // false' predict_trigger.json)" >> "$GITHUB_OUTPUT"
            if [ -n "$RESULTS" ]; then
              # answer-checking: only save the results and payouts of the listed races
              echo "cards_only=true" >> "$GITHUB_OUTPUT"
              python -m keiba.cards --results "$RESULTS"
              exit 0
            fi
            echo "cards_only=$(jq -r '.cards_only // false' predict_trigger.json)" >> "$GITHUB_OUTPUT"
          fi
          python -m keiba.cards --grades "$GRADES" ${DATES:+--dates "$DATES"}
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jra_keiba/data/cards
          git commit -q -m "Update race cards and odds" || exit 0
          for i in 1 2 3 4; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((2 ** i))
          done
      - name: Train (only when data or code changed) and predict
        if: steps.fetch.outputs.cards_only != 'true'
        working-directory: jra_keiba
        env:
          BANKROLL: ${{ inputs.bankroll || '100000' }}
          RETRAIN: ${{ steps.fetch.outputs.retrain }}
        run: |
          extra=""
          if [ "$RETRAIN" = "true" ] || { [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" = "5" ]; }; then
            extra="--retrain"
          fi
          python -m keiba.predict --bankroll "$BANKROLL" $extra
      - name: Commit report
        if: steps.fetch.outputs.cards_only != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jra_keiba/data/cards jra_keiba/reports
          git commit -q -m "Update JRA predictions" || exit 0
          for i in 1 2 3 4; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((2 ** i))
          done
